{% extends 'base.html' %}

{% block content %}
<div class="card p-4 mx-auto" style="max-width: 500px;">
    <h3>Delete Confirmation</h3>
    <p>Are you sure you want to delete the application for <strong>{{ job.position }}</strong> at <strong>{{ job.company_name }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'job_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
